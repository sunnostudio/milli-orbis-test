name: Schedule Image (X半自動投稿用)

on:
  schedule:
    - cron: "0 21 * * *" # JST 06:00
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bot-data-push
  cancel-in-progress: false

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -q pillow

      - name: Generate schedule image
        run: python3 tools/gen-schedule-image.py

      - name: Commit and push if changed
        run: |
          git config user.name "Milli Orbis Bot"
          git config user.email "bot@milliorbis.local"
          git add images/x-schedule.png
          git diff --cached --quiet && exit 0
          git commit -m "chore: update daily schedule image"
          n=0
          until git pull --rebase origin HEAD && git push; do
            git rebase --abort 2>/dev/null || true
            n=$((n+1))
            if [ "$n" -ge 5 ]; then echo "push failed after retries"; exit 1; fi
            sleep 20
          done
