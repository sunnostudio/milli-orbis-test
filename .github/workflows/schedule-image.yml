name: Schedule Image (X半自動投稿用)

on:
  schedule:
    - cron: "0 21 * * *" # JST 06:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install fonts and deps
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-ipafont-gothic
          pip install -q pillow

      - name: Generate schedule image
        run: python3 tools/gen-schedule-image.py

      - name: Commit and push if changed
        run: |
          git config user.name "Milli Orbis Bot"
          git config user.email "bot@milliorbis.local"
          git add images/x-schedule.png
          git diff --cached --quiet || git commit -m "chore: update daily schedule image"
          git push
