name: Fetch YouTube Data

on:
  schedule:
    - cron: "0 0,4,8,12,16,20 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bot-data-push
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch YouTube data
        run: node scripts/fetch-data.js
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

      - name: Generate calendar.ics
        run: node scripts/gen-calendar-ics.js

      - name: Fetch songs data
        run: node scripts/fetch-songs.js
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

      - name: Fetch karaoke data
        run: node scripts/fetch-karaoke.js
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

      - name: Fetch album arts
        run: node scripts/fetch-album-arts.js

      - name: Commit and push
        run: |
          git config user.name "Milli Orbis Bot"
          git config user.email "bot@milliorbis.local"
          git add data/youtube.json data/youtube.backup.json calendar.ics data/songs.js data/karaoke.js data/song-master.js
          git diff --cached --quiet && exit 0
          git commit -m "chore: update youtube data"
          n=0
          until git pull --rebase origin HEAD && git push; do
            git rebase --abort 2>/dev/null || true
            n=$((n+1))
            if [ "$n" -ge 5 ]; then echo "push failed after retries"; exit 1; fi
            sleep 20
          done
