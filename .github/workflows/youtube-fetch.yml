name: Fetch YouTube Data

on:
  # YouTube Data API の1日あたりquota（既定10,000 units）超過を防ぐため1日2回に制限。
  # 1回あたり約2,700 units消費（search.list 100units×約26回が大半）のため、
  # 旧設定の1日6回（約16,000 units/日）では quotaExceeded で毎回失敗していた。
  # quotaは米太平洋時間の深夜にリセットされるため、07:00/19:00 UTCに実行する。
  schedule:
    - cron: "0 7,19 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bot-data-push
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch YouTube data
        run: node scripts/fetch-data.js
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

      - name: Generate calendar.ics
        run: node scripts/gen-calendar-ics.js

      - name: Fetch songs data
        run: node scripts/fetch-songs.js
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

      - name: Fetch karaoke data
        run: node scripts/fetch-karaoke.js
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

      - name: Fetch album arts
        run: node scripts/fetch-album-arts.js

      - name: Commit and push
        run: |
          git config user.name "Milli Orbis Bot"
          git config user.email "bot@milliorbis.local"
          # translate-cache.json は翻訳キャッシュの更新で毎回変わるためadd対象に含める。
          # 含めないと unstaged changes が残り、以降の git pull --rebase が失敗する。
          git add data/youtube.json data/youtube.backup.json calendar.ics data/songs.js data/karaoke.js data/song-master.js data/translate-cache.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: update youtube data"
          n=0
          until git pull --rebase --autostash origin HEAD && git push; do
            git rebase --abort 2>/dev/null || true
            n=$((n+1))
            if [ "$n" -ge 5 ]; then echo "push failed after retries"; exit 1; fi
            sleep 20
          done
