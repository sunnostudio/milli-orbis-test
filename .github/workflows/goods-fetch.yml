name: Fetch Goods Data

on:
  schedule:
    - cron: "0 18 * * *" # JST 03:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-goods:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch goods from shop.milpr.com
        run: node tools/fetch-goods.js
      - name: Commit and push if changed
        run: |
          git config user.name "Milli Orbis Bot"
          git config user.email "bot@milliorbis.local"
          git add data.js data/goods-fetched.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: update goods data"
          git pull --rebase origin HEAD
          git push
