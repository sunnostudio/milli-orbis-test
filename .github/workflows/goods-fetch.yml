name: Fetch Goods Data

on:
  schedule:
    - cron: "0 18 * * *" # JST 03:00
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bot-data-push
  cancel-in-progress: false

jobs:
  fetch-goods:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch goods from shop.milpr.com
        run: node tools/fetch-goods.js
      - name: Commit and push if changed
        run: |
          git config user.name "Milli Orbis Bot"
          git config user.email "bot@milliorbis.local"
          git add data.js data/goods-fetched.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: update goods data"
          n=0
          until git pull --rebase origin HEAD && git push; do
            git rebase --abort 2>/dev/null || true
            n=$((n+1))
            if [ "$n" -ge 5 ]; then echo "push failed after retries"; exit 1; fi
            sleep 20
          done
