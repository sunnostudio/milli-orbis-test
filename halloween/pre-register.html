<body class="spooky-body pre-dark">
<div class="spooky-wrap">

  <p class="spooky-kicker en">HOTEL GRAND MILLI — PRE-REGISTER</p>
  <h1 class="spooky-title"><span class="en">Pre-register</span><br>事前登録</h1>
  <p class="spooky-sub">お名前とご案内役の仮面を選ぶと、あなた宛ての招待状が完成します。画像を保存してXにポストしてください（ホテル内フロアへの移動はありません）。</p>

  <div class="spooky-note">ファンメイドの試作品です。ミリプロ公式とは関係ありません。<br>Xの投稿画面には画像が自動添付されないため、①保存 → ②画像を添えてポストの順でどうぞ。</div>

  <div class="deco-divider" aria-hidden="true"><i></i><i></i><i></i></div>

  <div class="guest-row">
    <label for="shareNameInput">GUEST —</label>
    <input id="shareNameInput" type="text" maxlength="14" placeholder="お名前をどうぞ" autocomplete="off">
  </div>

  <section class="spooky-floor" data-floor-section="1" data-floor="1">
    <span class="spooky-tag en">MASK — ESCORT</span>
    <h2>ご案内役の仮面<span class="en">Choose your escort</span></h2>
    <div class="mask-grid" id="maskGrid"></div>
  </section>

  <div class="share-glow">
    <div class="deco-frame">
      <div class="share-card" aria-live="polite">
        <img class="art" src="images/invite/invite-base.webp" alt="HOTEL GRAND MILLI の招待状">
        <div class="share-name" id="shareNameOut">Guest</div>
        <div class="share-mask is-empty" id="shareMaskOut"></div>
      </div>
    </div>
  </div>

  <div class="deco-divider" aria-hidden="true"><i></i><i></i><i></i></div>

  <p class="invite-hint" id="shareHint"></p>
  <div class="share-actions">
    <button type="button" class="mask-btn" id="shareSave" disabled>① 画像を保存</button>
    <button type="button" class="mask-btn" id="sharePost" disabled>② Xにポストする</button>
  </div>
  <p class="share-order">ポスト文に一言添えたい場合は、Xの画面で追記できます。</p>

  <p style="margin-top:30px"><a href="../index.html" style="color:var(--spooky-gold-hi)">← ポータルトップへ</a></p>

</div>
<script src="spooky-share.js?v=3" defer></script>
</body>
